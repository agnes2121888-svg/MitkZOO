<title>策划牧場</title>
<style>
  :root {
    --soil: #5a3b28;
    --soil-dark: #3f2a1c;
    --grass: #86b25a;
    --grass-dark: #6b9645;
    --straw: #f4e6b8;
    --sky: #cfe7ef;
    --coin: #f5b932;
    --coin-edge: #c98a12;
    --ink: #2b2118;
    --u: clamp(0.243px, 0.0378vh, 0.46px);   /* 參考圖 1 像素對應的螢幕大小，人物與地板共用同一比例 */
    --safe: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--soil-dark);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; flex-direction: column; position: relative;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }

  /* 上方：存檔鈕 + 右上角金錢 */
  .hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    padding: calc(10px + var(--safe)) 12px 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .money { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .purse { display: flex; align-items: center; gap: 8px; background: rgba(30,22,16,.62); color: var(--straw); border-radius: 999px; padding: 4px 16px 4px 5px; }

  .per { font-size: 12px; font-weight: 800; color: var(--soil); text-shadow: 0 1px 0 rgba(255,255,255,.75); }
  button.tool {
    pointer-events: auto; font: inherit; font-size: 14px; font-weight: 800;
    color: var(--straw); background: rgba(30,22,16,.62); border: 0; border-radius: 999px;
    padding: 8px 16px; min-height: 40px; cursor: pointer; touch-action: manipulation;
  }
  button.tool:active { background: rgba(244,230,184,.18); }
  button.tool:focus-visible, .hero:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .stage {
    position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--u) * 403); z-index: 1;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .tabs { position: absolute; top: calc(var(--safe) + 72px); left: 8px; right: 8px; z-index: 3; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs[hidden] { display: none; }
  .tab {
    flex: none; font: inherit; font-size: 13px; font-weight: 800; color: var(--soil);
    background: rgba(244,230,184,.88); border: 2px solid var(--soil); border-radius: 999px;
    padding: 6px 14px; min-height: 34px; cursor: pointer; touch-action: manipulation;
  }
  .tab[aria-current="true"] { background: var(--soil); color: var(--straw); }
  .zinfo { position: absolute; top: calc(var(--safe) + 126px); left: 0; right: 0; z-index: 1; text-align: center; font-size: 14px; font-weight: 800; color: var(--soil); }
  .zstage {
    position: absolute; left: 0; right: 0; top: calc(var(--safe) + 156px); bottom: calc(var(--u) * 403); z-index: 1;
    padding: 0 12px; display: flex; align-items: flex-end; gap: 8px;
  }
  .keeper { flex: none; text-align: center; color: var(--soil); }
  .keeper .face { font-size: 72px; line-height: 1; }
  .keeper small { display: block; font-weight: 800; font-size: 12px; }
  .herd { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: flex-end; }
  .animal { font-size: 34px; line-height: 1.1; animation: bob 1.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .hero {
    height: calc(var(--u) * 370);
    position: relative;
    aspect-ratio: 400 / 711;
    background: none; border: 0; padding: 0; margin: 0;
    cursor: pointer; touch-action: manipulation;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 2px 0 rgba(63,42,28,.25));
  }
  .hero::before { content: ""; position: absolute; inset: -14px; }
  .hero img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  .hero.hit { animation: squish .16s ease-out; }
  @keyframes squish {
    0%   { transform: scale(1, 1); }
    40%  { transform: scale(1.06, .93); }
    100% { transform: scale(1, 1); }
  }

  .hint {
    position: absolute; top: calc(var(--safe) + 126px); left: 0; right: 0; z-index: 1; text-align: center;
    font-size: 14px; font-weight: 700; color: var(--soil);
    pointer-events: none; transition: opacity .4s;
  }

  /* 金幣與飄字 */
  .fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }

  .plus {
    position: absolute; left: 0; top: 0;
    font-size: 24px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 5px var(--soil-dark); paint-order: stroke fill;
    text-shadow: 0 2px 0 var(--soil-dark);
    will-change: transform, opacity;
  }

  /* 版面：場景在上，商店在下 */
  .play { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .shop {
    flex: 0 0 auto; height: clamp(214px, 28vh, 270px);
    background: linear-gradient(#2c1f15, var(--soil-dark)); color: var(--straw);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 4px solid var(--soil); display: flex; flex-direction: column;
  }
  .cards { flex: 1; min-height: 0; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  #zones { display: contents; }
  .card {
    flex: 0 0 136px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center;
    background: var(--straw); color: var(--ink); border-radius: 12px; padding: 8px;
  }
  .card .ic { font-size: 30px; line-height: 1; height: 38px; display: flex; align-items: center; }
  .card .name { font-weight: 800; font-size: 14px; }
  .card .name small { font-weight: 700; font-size: 11px; color: #7a6652; margin-left: 4px; }
  .card .desc { font-size: 11px; line-height: 1.3; color: #5d4a39; flex: 1; }
  .card.locked { background: rgba(244,230,184,.14); color: rgba(244,230,184,.75); justify-content: center; }
  .card.locked .desc { color: rgba(244,230,184,.6); flex: 0; }
  .card[hidden] { display: none; }
  .stabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .stab {
    flex: 1; font: inherit; font-weight: 800; font-size: 14px; min-height: 36px; cursor: pointer; touch-action: manipulation;
    color: var(--straw); background: rgba(244,230,184,.12); border: 2px solid rgba(244,230,184,.35); border-radius: 10px;
  }
  .stab[aria-selected="true"] { background: var(--coin); color: var(--ink); border-color: var(--coin-edge); }
  .buy {
    width: 100%; min-height: 44px; padding: 4px 8px; font: inherit; font-weight: 800; font-size: 14px; line-height: 1.2;
    color: var(--ink); background: var(--coin); border: 3px solid var(--coin-edge); border-radius: 10px;
    cursor: pointer; touch-action: manipulation;
  }
  .buy small { display: block; font-weight: 700; font-size: 11px; }
  .buy:active:not(:disabled) { transform: translateY(1px); }
  .buy:disabled { background: #d9ccae; border-color: #b9a982; color: #8b7b60; cursor: not-allowed; }
  .buy:focus-visible { outline: 3px solid var(--soil); outline-offset: 2px; }
  .keeper .meter { width: 72px; margin: 4px auto 0; }
  .item.zone { display: block; }
  .meter { height: 8px; margin-top: 6px; background: #d9ccae; border-radius: 4px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: #e0746a; border-radius: 4px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .acts .buy { flex: 1 1 96px; }
  /* 鞭子倒數條 */
  .whipbar {
    position: absolute; left: 16px; right: 16px; top: calc(var(--safe) + 114px); z-index: 3; height: 12px;
    background: rgba(63,42,28,.55); border-radius: 6px; overflow: hidden;
    pointer-events: none;
  }
  .whipbar span { display: block; height: 100%; width: 0; background: var(--coin); border-radius: 6px; }
  .whipbar[hidden] { display: none; }

  /* 存檔視窗 */
  dialog {
    width: min(92vw, 420px); border: 0; border-radius: 14px; padding: 18px;
    background: var(--straw); color: var(--ink);
  }
  dialog::backdrop { background: rgba(40,26,18,.6); }
  dialog h2 { margin: 0 0 10px; font-size: 18px; }
  dialog textarea {
    width: 100%; height: 110px; resize: none; font: 12px/1.4 ui-monospace, monospace;
    border: 2px solid var(--soil); border-radius: 8px; padding: 8px; background: #fffaf0; color: var(--ink);
    user-select: text; -webkit-user-select: text;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .row button {
    flex: 1; font: inherit; font-weight: 700; padding: 11px 10px; min-height: 44px;
    border-radius: 10px; border: 2px solid var(--soil); cursor: pointer;
    background: var(--soil); color: var(--straw); touch-action: manipulation;
  }
  .row button.ghost { background: transparent; color: var(--soil); }
  .msg { min-height: 20px; margin-top: 8px; font-size: 13px; }

  @media (prefers-reduced-motion: reduce) {
    .hero.hit, .animal { animation: none; }
  }
</style>
</head>

  <button class="tool" id="saveBtn">存檔</button>
  <div class="money">

    <div class="per">每次點擊 +<span id="perClick">1</span>　每秒 +<span id="cps">0</span></div>
  </div>
</header>

<script>
(() => {
  'use strict';

  const SAVE_KEY = 'strategist-farm-save';
  const VERSION = 3;

  const state = { coins: 0, perClick: 1, totalClicks: 0, whip: 0 };

  // 鞭子：等級 1 = 購買，之後每級縮短自動點擊間隔
  const WHIP = [
    { every: 5,   cost: 50 },
    { every: 4,   cost: 120 },
    { every: 3,   cost: 300 },
    { every: 2.2, cost: 800 },
    { every: 1.6, cost: 2000 },
    { every: 1.2, cost: 5000 },
    { every: 0.9, cost: 12000 },
    { every: 0.6, cost: 30000 },
    { every: 0.4, cost: 80000 },
  ];
  let whipAcc = 0;   // 目前已累積的秒數

  // 區域：動物負責產出，飼養員好感度是該區倍率
  const ZONES = [
    { name: '雞舍', keeper: '小雅', animal: '母雞', icon: '🐔', unlock: 300,   price: 15,   cps: 0.2,
      gifts: [{ n: '玉米粒', c: 20, p: 1 }, { n: '手作餅乾', c: 60, p: 3, fav: 1 }] },
    { name: '羊圈', keeper: '阿山', animal: '綿羊', icon: '🐑', unlock: 3000,  price: 150,  cps: 2,
      gifts: [{ n: '熱茶', c: 200, p: 1 }, { n: '羊毛手套', c: 600, p: 3, fav: 1 }] },
    { name: '牛棚', keeper: '大熊', animal: '乳牛', icon: '🐄', unlock: 30000, price: 1500, cps: 16,
      gifts: [{ n: '保溫壺', c: 2000, p: 1 }, { n: '牛仔帽', c: 6000, p: 3, fav: 1 }] },
  ];
  const freshZones = () => ZONES.map(() => ({ open: false, animals: 0, pts: 0 }));
  state.z = freshZones();
  const MAXLV = 10;
  const need = lv => 6 * (lv + 1);
  const mult = lv => 1 + 0.2 * lv;
  function lvOf(pts) {
    let lv = 0;
    while (lv < MAXLV && pts >= need(lv)) { pts -= need(lv); lv++; }
    return [lv, pts, lv < MAXLV ? need(lv) : 0];
  }
  const animalCost = (z, s) => Math.ceil(z.price * Math.pow(1.15, s.animals));
  const giftCost = (g, lv) => Math.ceil(g.c * Math.pow(1.25, lv));
  function cps() {
    let t = 0;
    ZONES.forEach((z, i) => { const s = state.z[i]; if (s.open) t += s.animals * z.cps * mult(lvOf(s.pts)[0]); });
    return t;
  }

  const $ = id => document.getElementById(id);
  const totalEl = $('total'), perEl = $('perClick');
  const hero = $('hero'), fx = $('fx'), field = $('field'), hint = $('hint');

  // ---------- 數字顯示 ----------
  const SUFFIX = ['', 'K', 'M', 'B', 'T'];
  function fmt(n) {
    if (n < 1000) return Math.floor(n).toString();
    const i = Math.min(Math.floor(Math.log10(n) / 3), SUFFIX.length - 1);
    return (n / Math.pow(1000, i)).toFixed(2).replace(/\.?0+$/, '') + SUFFIX[i];
  }
  const whipBtn = $('whipBtn'), whipDesc = $('whipDesc'), whipLv = $('whipLv');
  const whipBar = $('whipbar'), whipFill = $('whipfill');
  const setHTML = (el, h) => { if (el._h !== h) { el._h = h; el.innerHTML = h; } };
  const secs = n => (Math.round(n * 10) / 10).toString();

  function render() {
    totalEl.textContent = fmt(state.coins);
    perEl.textContent = fmt(state.perClick);
    const c = cps();
    $('cps').textContent = c < 10 ? (Math.round(c * 10) / 10).toString() : fmt(c);
    if (typeof updateBuy === 'function') updateBuy();

    const lv = state.whip, next = WHIP[lv];
    whipBar.hidden = lv === 0;
    whipLv.textContent = lv ? ' Lv.' + lv : '';
    whipDesc.textContent = lv
      ? '每 ' + secs(WHIP[lv - 1].every) + ' 秒自動點擊一次'
      : '買下後自動點擊';
    if (!next) {
      whipBtn.disabled = true;
      setHTML(whipBtn, '已滿級');
    } else {
      whipBtn.disabled = state.coins < next.cost;
      setHTML(whipBtn, (lv ? '強化' : '購買') + '<small>' + fmt(next.cost) + ' 金幣</small>'
        + (lv ? '<small>→ ' + secs(next.every) + ' 秒</small>' : ''));
    }
  }

  // ---------- 掉金幣動畫 ----------
  const GRAVITY = 1900;           // px/s²
  const MAX_ACTIVE = 80;
  const GROUND = 0.34;           // 與 CSS 的 --g 一致
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const active = new Set();
  let rafId = 0, last = 0;

  function spawnCoin(x, y, fieldH) {
    if (active.size >= MAX_ACTIVE) return;
    const el = document.createElement('div');
    el.className = 'drop';
    fx.appendChild(el);
    const floor = hero.getBoundingClientRect().bottom - field.getBoundingClientRect().top + Math.random() * 16; // 落在人物腳邊
    active.add({
      el, x, y, floor,
      vx: (Math.random() - 0.5) * 260,
      vy: -(260 + Math.random() * 280),
      bounces: 0, life: 0, fade: 0,
    });
    if (!rafId) { last = performance.now(); rafId = requestAnimationFrame(tick); }
  }

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    for (const c of active) {
      c.life += dt;
      c.vy += GRAVITY * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      if (c.y >= c.floor) {
        c.y = c.floor;
        if (c.bounces < 2) { c.vy = -c.vy * 0.42; c.vx *= 0.6; c.bounces++; }
        else { c.vy = 0; c.vx = 0; c.fade += dt; }
      }
      const opacity = c.fade > 0.35 ? Math.max(0, 1 - (c.fade - 0.35) / 0.4) : 1;
      c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
      c.el.style.opacity = opacity;
      if (opacity <= 0 || c.life > 4) { c.el.remove(); active.delete(c); }
    }
    rafId = active.size ? requestAnimationFrame(tick) : 0;
  }

  function floatPlus(x, y, text) {
    const el = document.createElement('div');
    el.className = 'plus';
    el.textContent = text;
    el.style.transform = `translate(${x - 14}px, ${y - 20}px)`;
    fx.appendChild(el);
    if (reduceMotion) { setTimeout(() => el.remove(), 600); return; }
    const dx = (Math.random() - 0.5) * 40;
    const a = el.animate([
      { transform: `translate(${x - 14}px, ${y - 20}px) scale(.7)`, opacity: 0 },
      { transform: `translate(${x - 14 + dx * .4}px, ${y - 50}px) scale(1.15)`, opacity: 1, offset: .25 },
      { transform: `translate(${x - 14 + dx}px, ${y - 110}px) scale(1)`, opacity: 0 },
    ], { duration: 800, easing: 'ease-out' });
    a.onfinish = () => el.remove();
  }

  // ---------- 點擊 ----------
  function harvest(clientX, clientY) {
    const r = field.getBoundingClientRect();
    const x = clientX - r.left, y = clientY - r.top;

    state.coins += state.perClick;
    state.totalClicks++;
    render();

    floatPlus(x, y, '+' + fmt(state.perClick));
    if (!reduceMotion) {
      const n = 1 + (Math.random() < 0.5 ? 1 : 0);   // 每次 1～2 枚
      for (let i = 0; i < n; i++) spawnCoin(x, y, r.height);
    }

    hero.classList.remove('hit');
    void hero.offsetWidth;
    hero.classList.add('hit');

    if (hint.style.opacity !== '0') hint.style.opacity = '0';
  }

  // ---------- 區域商店 ----------
  const zonesEl = $('zones');
  let shopTab = 'whip';
  function renderZones() {
    $('whipCard').hidden = shopTab !== 'whip';
    $('zooCard').hidden = shopTab !== 'ranch';
    document.querySelectorAll('.stab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === shopTab));
    let h = '';
    const card = (ic, name, desc, btn) => `<div class="card"><div class="ic">${ic}</div><div class="name">${name}</div><div class="desc">${desc}</div>${btn}</div>`;
    const btn = (act, i, cost, label, extra = '') => `<button class="buy" data-act="${act}" data-z="${i}" data-cost="${cost}"${extra}>${label}<small>${fmt(cost)} 金幣</small></button>`;
    ZONES.forEach((z, i) => {
      const s = state.z[i];
      const [lv] = lvOf(s.pts);
      if (shopTab === 'ranch') {
        if (s.open) h += card(z.icon, `${z.animal} ×${s.animals}`, `${z.name}　每隻每秒 +${f1(z.cps * mult(lv))}`, btn('animal', i, animalCost(z, s), '飼養'));
        else if (i === 0 || state.z[i - 1].open) h += card('🔒', `${z.icon} ${z.name}`, `解鎖後飼養${z.animal}，認識${z.keeper}`, btn('unlock', i, z.unlock, '解鎖'));
      } else if (shopTab === 'char' && s.open) {
        z.gifts.forEach((g, j) => {
          const mx = lv >= MAXLV;
          h += card(g.fav ? '💝' : '🎁', `送${g.n}`, `${z.keeper} Lv.${lv}　好感 +${g.p}${g.fav ? '（最愛）' : ''}`,
            btn('gift', i, giftCost(g, lv), mx ? '已滿級' : '贈送', ` data-g="${j}"${mx ? ' data-max="1"' : ''}`));
        });
      }
    });
    if (shopTab === 'char' && !state.z[0].open) h = card('🔒', '還沒有飼養員', '先到「牧場」解鎖雞舍', '');
    zonesEl.innerHTML = h;
    updateBuy();
    renderWorld();
  }
  $('stabs').addEventListener('click', e => {
    const b = e.target.closest('.stab');
    if (!b) return;
    shopTab = b.dataset.t; $('cards').scrollLeft = 0; renderZones();
  });
  // ---------- 橫向世界 ----------
  const world = $('world'), tabs = $('tabs');
  const f1 = n => n < 10 ? (Math.round(n * 10) / 10).toString() : fmt(n);
  const go = idx => world.scrollTo({ left: idx * world.clientWidth, behavior: 'smooth' });
  function layout() {
    [...world.children].forEach((p, i) => p.style.setProperty('--bx', (-i * world.clientWidth) + 'px'));
  }
  function updateTabs() {
    const idx = Math.round(world.scrollLeft / Math.max(1, world.clientWidth));
    tabs.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', +b.dataset.i === idx));
  }
  function renderWorld() {
    let tb = '<button class="tab" data-i="0">策划</button>';
    ZONES.forEach((z, i) => {
      const s = state.z[i];
      let p = $('z' + i);
      if (!s.open) { if (p) p.remove(); return; }
      if (!p) { p = document.createElement('section'); p.className = 'panel'; p.id = 'z' + i; world.appendChild(p); }
      const [lv, cur, nd] = lvOf(s.pts), shown = Math.min(s.animals, 30);
      p.innerHTML = `<div class="zinfo">${z.name}　${s.animals} 隻　產出 ×${mult(lv).toFixed(1)}　每秒 +${f1(s.animals * z.cps * mult(lv))}</div>
        <div class="zstage"><div class="keeper"><div class="face">🧑‍🌾</div><small>${z.keeper} Lv.${lv}</small><div class="meter"><span style="width:${nd ? cur / nd * 100 : 100}%"></span></div></div>
        <div class="herd">${Array.from({ length: shown }, (_, k) => `<span class="animal" style="--d:${(k * 0.37 % 1.6).toFixed(2)}s">${z.icon}</span>`).join('')}</div></div>`;
      tb += `<button class="tab" data-i="${i + 1}">${z.name}</button>`;
    });
    tabs.hidden = !state.z[0].open;
    setHTML(tabs, tb);
    layout(); updateTabs();
  }
  tabs.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(+b.dataset.i); });
  let scrollRaf = 0;
  world.addEventListener('scroll', () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; updateTabs(); }); }, { passive: true });
  addEventListener('resize', () => { layout(); world.scrollLeft = Math.round(world.scrollLeft / Math.max(1, world.clientWidth)) * world.clientWidth; updateTabs(); });

  function updateBuy() {
    zonesEl.querySelectorAll('button[data-cost]').forEach(b => {
      b.disabled = b.hasAttribute('data-max') || state.coins < +b.dataset.cost;
    });
  }
  zonesEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b || b.disabled) return;
    const i = +b.dataset.z, z = ZONES[i], s = state.z[i], cost = +b.dataset.cost;
    if (state.coins < cost) return;
    if (b.dataset.act === 'unlock') { if (i > 0 && !state.z[i - 1].open) return; s.open = true; }
    else if (b.dataset.act === 'animal') s.animals++;
    else s.pts += z.gifts[+b.dataset.g].p;
    state.coins -= cost;
    render(); renderZones(); saveLocal();
    if (b.dataset.act === 'unlock') go(i + 1);
  });

  // ---------- 鞭子 ----------
  whipBtn.addEventListener('click', () => {
    const next = WHIP[state.whip];
    if (!next || state.coins < next.cost) return;
    state.coins -= next.cost;
    state.whip++;
    whipAcc = 0;
    render();
    saveLocal();
  });

  function heroCenter() {
    const b = hero.getBoundingClientRect();
    return [b.left + b.width / 2, b.top + b.height * 0.35];
  }

  let lastFrame = Date.now(), lastRender = 0;
  function whipLoop() {
    const now = Date.now();
    const dt = Math.min((now - lastFrame) / 1000, 600);   // 背景分頁最多補算 10 分鐘
    lastFrame = now;
    state.coins += cps() * dt;
    if (now - lastRender > 250) { lastRender = now; render(); }
    if (state.whip > 0) {
      const every = WHIP[state.whip - 1].every;
      whipAcc += dt;
      const n = Math.floor(whipAcc / every);
      if (n > 0) {
        whipAcc -= n * every;
        if (n === 1 || !document.hidden && n <= 3) {
          for (let i = 0; i < n; i++) { const [x, y] = heroCenter(); harvest(x, y); }
        } else {
          state.coins += n * state.perClick;   // 補算：只加錢，不播動畫
          state.totalClicks += n;
          render();
        }
      }
      whipFill.style.width = Math.min(100, whipAcc / every * 100) + '%';
    }
    requestAnimationFrame(whipLoop);
  }

  // pointerdown：多指同時點也會各算一次，手機連點也順
  hero.addEventListener('pointerdown', e => {
    e.preventDefault();
    harvest(e.clientX, e.clientY);
  });
  // 鍵盤（Enter / 空白鍵）
  hero.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (e.repeat) return;
      const b = hero.getBoundingClientRect();
      harvest(b.left + b.width / 2, b.top + b.height * 0.35);
    }
  });
  hero.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- 存檔 ----------
  function toCode() {
    const data = { v: VERSION, t: Date.now(), coins: state.coins, perClick: state.perClick, totalClicks: state.totalClicks, whip: state.whip, z: state.z };
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function fromCode(code) {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!data || typeof data.coins !== 'number' || !isFinite(data.coins) || data.coins < 0) throw new Error('bad');
    state.coins = data.coins;
    state.perClick = Math.max(1, Number(data.perClick) || 1);
    state.totalClicks = Math.max(0, Number(data.totalClicks) || 0);
    state.whip = Math.min(WHIP.length, Math.max(0, Math.floor(Number(data.whip) || 0)));
    const zs = Array.isArray(data.z) ? data.z : [], nz = [];
    ZONES.forEach((_, i) => {
      const s = zs[i] || {};
      nz.push({ open: !!s.open && (i === 0 || nz[i - 1].open),
                animals: Math.max(0, Math.floor(+s.animals || 0)),
                pts: Math.max(0, Math.floor(+s.pts || 0)) });
    });
    state.z = nz;
    whipAcc = 0;
  }
  function saveLocal() {
    try { localStorage.setItem(SAVE_KEY, toCode()); } catch (_) {}
  }
  function loadLocal() {
    try { const s = localStorage.getItem(SAVE_KEY); if (s) fromCode(s); } catch (_) {}
  }

  setInterval(saveLocal, 15000);
  addEventListener('pagehide', saveLocal);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveLocal(); });

  // ---------- 存檔視窗 ----------
  const dlg = $('dlg'), code = $('code'), msg = $('msg');
  const say = t => { msg.textContent = t; };

  $('saveBtn').addEventListener('click', () => { code.value = ''; say(''); dlg.showModal(); });
  $('closeBtn').addEventListener('click', () => dlg.close());

  $('exportBtn').addEventListener('click', async () => {
    code.value = toCode();
    try { await navigator.clipboard.writeText(code.value); say('已複製存檔代碼。'); }
    catch (_) { code.select(); say('請手動全選並複製上方代碼。'); }
  });
  $('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([toCode()], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'farm-save.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    say('已下載 farm-save.txt。');
  });
  $('importBtn').addEventListener('click', () => {
    if (!code.value.trim()) { say('請先貼上存檔代碼。'); return; }
    try { fromCode(code.value); render(); renderZones(); saveLocal(); say('匯入成功。'); }
    catch (_) { say('代碼無法讀取，請確認有完整複製。'); }
  });

  // 禁止雙擊縮放（iOS）
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const n = Date.now();
    if (n - lastTouch < 300) e.preventDefault();
    lastTouch = n;
  }, { passive: false });

  loadLocal();
  render();
  renderZones();
  requestAnimationFrame(whipLoop);
})();
</script>
</body>
</html>
